<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do JS Avançado</title>
    <!-- Project CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Project JS -->
    <script src="js/app.js" defer></script>
</head>

<body>

    <main>
        <div class="to-do-container">

            <header>
                <h1>To Do Avançado</h1>
            </header>

            <!-- Taks Add Form -->
            <form id="to-do-form">
                <p>Adicionar Tarefa</p>

                <div class="form-control">
                    <input type="text" id="to-do-input" placeholder="O que você vai fazer?">

                    <button type="submit">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </form>

            <!-- Task Edit Form -->
            <form id="edit-form" class="edit-form">

                <p>Editar tarefa</p>

                <div class="form-control">
                    <input type="text" id="edit-input">

                    <button type="submit">
                        <i class="fa-solid fa-check-double"></i>
                    </button>
                </div>
                <button id="cancel-edit-btn">Cancelar</button>
            </form>

            <!-- Tool Bar -->
            <div id="tool-bar">
                <!-- Task Search -->
                <div id="search">
                    <h4>Pesquisar:</h4>

                    <form>
                        <input type="text" id="search-input" placeholder="Buscar">

                        <button id="erase-button">
                            <i class="fa-solid fa-delete-left"></i>
                        </button>
                    </form>
                </div>

                <!-- Filter -->
                <div id="filter">
                    <h4>Filtrar:</h4>

                    <select id="filter-select">
                        <option value="all">Todos</option>
                        <option value="done">Feitas</option>
                        <option value="to-do">A fazer</option>
                    </select>
                </div>
            </div>

            <!-- Tasks -->
            <div id="to-do-list">

                <div class="to-do">
                    <h3>Fazendo alguma coisa...</h3>

                    <button class="to-do-finish">
                        <i class="fa-solid fa-check"></i>
                    </button>

                    <button class="to-do-edit">
                        <i class="fa-solid fa-pen"></i>
                    </button>

                    <button class="to-do-remove">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div class="to-do">
                    <h3>Estudar JavaScript</h3>

                    <button class="to-do-finish">
                        <i class="fa-solid fa-check"></i>
                    </button>

                    <button class="to-do-edit">
                        <i class="fa-solid fa-pen"></i>
                    </button>

                    <button class="to-do-remove">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
